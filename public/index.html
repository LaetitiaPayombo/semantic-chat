<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Assistant Sémantique</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #ffffff;
    --surface:   #f7f8fa;
    --border:    #e5e7eb;
    --text:      #1f2328;
    --muted:     #57606a;
    --accent:    #3b82d4;
    --accent-dk: #2563b0;
    --danger:    #dc2626;
    --success:   #16a34a;
    --radius:    8px;
    --sidebar:   280px;
  }

  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Sidebar ────────────────────────────────────── */
  #sidebar {
    width: var(--sidebar);
    min-width: var(--sidebar);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 16px;
    overflow-y: auto;
  }

  #sidebar h1 {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border);
    flex-shrink: 0;
  }
  .dot.ok   { background: var(--success); }
  .dot.err  { background: var(--danger); }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 4px;
  }

  /* Upload zone */
  #drop-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 16px 12px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  #drop-zone:hover, #drop-zone.drag-over {
    border-color: var(--accent);
    background: #eef4fd;
    color: var(--accent);
  }
  #drop-zone input { display: none; }

  #upload-progress {
    font-size: 12px;
    color: var(--muted);
    min-height: 18px;
  }

  /* Docs folder button */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    width: 100%;
    transition: background 0.12s;
  }
  .btn:hover   { background: var(--surface); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent-dk); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Source list */
  #source-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
  #source-list li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 5px 8px;
    font-size: 12px;
    color: var(--text);
    gap: 6px;
  }
  #source-list li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .remove-btn {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 14px; line-height: 1;
    padding: 0 2px; flex-shrink: 0;
  }
  .remove-btn:hover { color: var(--danger); }

  /* ── Chat area ───────────────────────────────────── */
  #chat-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #chat-header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 15px;
    color: var(--text);
    background: var(--bg);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 3px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
  }
  .msg.system-note {
    align-self: center;
    background: none;
    color: var(--muted);
    font-size: 12px;
    border: none;
    padding: 2px 0;
  }

  /* Sources badge */
  .sources-badge {
    align-self: flex-start;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: -4px;
    margin-bottom: 4px;
  }
  .badge {
    font-size: 11px;
    padding: 2px 7px;
    background: #eef4fd;
    color: var(--accent);
    border: 1px solid #c7daf6;
    border-radius: 20px;
    white-space: nowrap;
  }

  /* Typing indicator */
  .typing {
    display: flex; gap: 4px; align-items: center; padding: 10px 14px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); border-bottom-left-radius: 3px;
    align-self: flex-start;
  }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted); animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }

  /* Input bar */
  #input-bar {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }
  #user-input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 9px 13px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    line-height: 1.5;
    min-height: 44px;
    max-height: 140px;
    outline: none;
    color: var(--text);
    background: var(--surface);
    transition: border-color 0.15s;
  }
  #user-input:focus { border-color: var(--accent); background: var(--bg); }

  #send-btn {
    align-self: flex-end;
    width: 44px; height: 44px;
    border-radius: var(--radius);
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.12s;
  }
  #send-btn:hover   { background: var(--accent-dk); }
  #send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  /* Clear chat */
  #clear-btn {
    background: none; border: none; cursor: pointer; color: var(--muted);
    font-size: 12px; padding: 4px 8px; border-radius: var(--radius);
  }
  #clear-btn:hover { color: var(--danger); background: #fef2f2; }

  /* Responsive — collapse sidebar on small screens */
  @media (max-width: 640px) {
    #sidebar { display: none; }
  }
</style>
</head>
<body>

<!-- ── Sidebar ──────────────────────────────────────────────────────────── -->
<aside id="sidebar">
  <h1>🔍 Assistant Sémantique</h1>

  <!-- Status -->
  <div>
    <div class="section-title">Statut</div>
    <div class="status-row">
      <span class="dot" id="ollama-dot"></span>
      <span id="ollama-label">Ollama — vérification…</span>
    </div>
    <div class="status-row" style="margin-top:4px">
      <span class="dot ok"></span>
      <span id="chunk-label">— chunks indexés</span>
    </div>
  </div>

  <!-- Upload PDF -->
  <div>
    <div class="section-title">Ajouter un PDF</div>
    <div id="drop-zone" tabindex="0" role="button" aria-label="Zone de dépôt de PDF">
      <input type="file" id="file-input" accept=".pdf" />
      Glissez un PDF ici<br />ou <strong>cliquez pour parcourir</strong>
    </div>
    <div id="upload-progress"></div>
  </div>

  <!-- Re-index docs/ -->
  <div>
    <div class="section-title">Dossier docs/</div>
    <button class="btn" id="reindex-btn">↻ Ré-indexer docs/</button>
  </div>

  <!-- Indexed sources -->
  <div style="flex:1; overflow-y:auto; min-height:0">
    <div class="section-title">Sources indexées</div>
    <ul id="source-list">
      <li id="no-sources" style="border:none; color:var(--muted); font-size:12px; padding:4px 0;">Aucune source</li>
    </ul>
  </div>
</aside>

<!-- ── Chat ─────────────────────────────────────────────────────────────── -->
<div id="chat-wrap">
  <div id="chat-header">
    <span style="flex:1">Conversation</span>
    <button id="clear-btn" title="Effacer la conversation">Effacer</button>
  </div>

  <div id="messages">
    <div class="msg system-note">
      Bonjour ! Posez-moi une question. J'utiliserai vos documents comme contexte si pertinent.
    </div>
  </div>

  <div id="input-bar">
    <textarea id="user-input" placeholder="Posez votre question…" rows="1"></textarea>
    <button id="send-btn" title="Envoyer">&#9658;</button>
  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
const conversationHistory = [];

// ── DOM refs ─────────────────────────────────────────────────────────────────
const messagesEl   = document.getElementById("messages");
const userInput    = document.getElementById("user-input");
const sendBtn      = document.getElementById("send-btn");
const clearBtn     = document.getElementById("clear-btn");
const dropZone     = document.getElementById("drop-zone");
const fileInput    = document.getElementById("file-input");
const uploadProg   = document.getElementById("upload-progress");
const reindexBtn   = document.getElementById("reindex-btn");
const sourceList   = document.getElementById("source-list");
const ollamaDot    = document.getElementById("ollama-dot");
const ollamaLabel  = document.getElementById("ollama-label");
const chunkLabel   = document.getElementById("chunk-label");

// ── Helpers ───────────────────────────────────────────────────────────────────

function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.textContent = text;
  messagesEl.appendChild(div);
  scrollBottom();
  return div;
}

function addSystemNote(text) {
  const div = document.createElement("div");
  div.className = "msg system-note";
  div.textContent = text;
  messagesEl.appendChild(div);
  scrollBottom();
}

function addTypingIndicator() {
  const div = document.createElement("div");
  div.className = "typing";
  div.innerHTML = "<span></span><span></span><span></span>";
  messagesEl.appendChild(div);
  scrollBottom();
  return div;
}

function showSourceBadges(items) {
  if (!items || items.length === 0) return;
  const wrap = document.createElement("div");
  wrap.className = "sources-badge";
  items.forEach(({ source, score }) => {
    const b = document.createElement("span");
    b.className = "badge";
    b.title = `Score: ${score}`;
    b.textContent = `📄 ${source}`;
    wrap.appendChild(b);
  });
  messagesEl.appendChild(wrap);
  scrollBottom();
}

// ── Status polling ────────────────────────────────────────────────────────────

async function refreshStatus() {
  try {
    const d = await fetch("/api/status").then(r => r.json());
    ollamaDot.className   = "dot " + (d.ollama ? "ok" : "err");
    ollamaLabel.textContent = "Ollama — " + (d.ollama ? "connecté" : "hors ligne");
    chunkLabel.textContent  = `${d.chunks} chunks indexés (${d.sources} source${d.sources !== 1 ? "s" : ""})`;
  } catch {
    ollamaDot.className = "dot err";
    ollamaLabel.textContent = "Serveur inaccessible";
  }
}

async function refreshSources() {
  const { sources } = await fetch("/api/sources").then(r => r.json());
  const noSrc = document.getElementById("no-sources");
  // Remove old dynamic entries
  [...sourceList.querySelectorAll("li:not(#no-sources)")].forEach(l => l.remove());
  if (sources.length === 0) {
    if (noSrc) noSrc.style.display = "";
    return;
  }
  if (noSrc) noSrc.style.display = "none";
  sources.forEach(src => {
    const li = document.createElement("li");
    li.innerHTML = `<span title="${src}">${src}</span>`;
    const btn = document.createElement("button");
    btn.className = "remove-btn";
    btn.title = "Supprimer la source";
    btn.textContent = "×";
    btn.onclick = () => removeSource(src);
    li.appendChild(btn);
    sourceList.appendChild(li);
  });
}

async function removeSource(name) {
  await fetch(`/api/source/${encodeURIComponent(name)}`, { method: "DELETE" });
  refreshSources();
  refreshStatus();
}

// ── Chat ──────────────────────────────────────────────────────────────────────

async function sendMessage() {
  const text = userInput.value.trim();
  if (!text) return;

  userInput.value = "";
  userInput.style.height = "auto";
  sendBtn.disabled = true;

  addMessage("user", text);
  conversationHistory.push({ role: "user", content: text });

  const typing = addTypingIndicator();

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: conversationHistory }),
    });

    if (!response.ok) {
      const err = await response.json();
      typing.remove();
      addSystemNote("Erreur : " + err.error);
      return;
    }

    // SSE streaming
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let assistantDiv = null;
    let assistantText = "";
    let sourcesShown = false;

    typing.remove();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const parts = buffer.split("\n\n");
      buffer = parts.pop(); // keep incomplete part

      for (const part of parts) {
        const lines = part.split("\n");
        const eventLine = lines.find(l => l.startsWith("event:"));
        const dataLine  = lines.find(l => l.startsWith("data:"));
        if (!eventLine || !dataLine) continue;

        const event = eventLine.slice(7).trim();
        let data;
        try { data = JSON.parse(dataLine.slice(5)); } catch { continue; }

        if (event === "sources" && !sourcesShown) {
          sourcesShown = true;
          showSourceBadges(data.items);
        } else if (event === "token") {
          if (!assistantDiv) {
            assistantDiv = addMessage("assistant", "");
          }
          assistantText += data.token;
          assistantDiv.textContent = assistantText;
          scrollBottom();
        } else if (event === "done") {
          conversationHistory.push({ role: "assistant", content: assistantText });
          refreshStatus();
        } else if (event === "error") {
          addSystemNote("Erreur LLM : " + data.message);
        }
      }
    }
  } catch (e) {
    typing.remove();
    addSystemNote("Erreur réseau : " + e.message);
  } finally {
    sendBtn.disabled = false;
    userInput.focus();
  }
}

// ── Upload PDF ─────────────────────────────────────────────────────────────────

async function uploadPdf(file) {
  if (!file || !file.name.endsWith(".pdf")) {
    uploadProg.textContent = "Seuls les fichiers PDF sont acceptés.";
    return;
  }
  uploadProg.textContent = `Indexation de ${file.name}…`;
  const fd = new FormData();
  fd.append("file", file);
  try {
    const res = await fetch("/api/upload", { method: "POST", body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    uploadProg.textContent = `✓ ${file.name} indexé (${data.chunks} chunks total)`;
    refreshSources();
    refreshStatus();
  } catch (e) {
    uploadProg.textContent = "Erreur : " + e.message;
  }
}

// ── Re-index docs/ ──────────────────────────────────────────────────────────────

reindexBtn.onclick = async () => {
  reindexBtn.disabled = true;
  reindexBtn.textContent = "Indexation…";
  try {
    const res = await fetch("/api/index", { method: "POST" });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    addSystemNote(`✓ docs/ ré-indexé — ${data.chunks} chunks, ${data.sources} source(s)`);
    refreshSources();
    refreshStatus();
  } catch (e) {
    addSystemNote("Erreur indexation : " + e.message);
  } finally {
    reindexBtn.disabled = false;
    reindexBtn.textContent = "↻ Ré-indexer docs/";
  }
};

// ── Event listeners ──────────────────────────────────────────────────────────

sendBtn.onclick = sendMessage;

userInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// Auto-resize textarea
userInput.addEventListener("input", () => {
  userInput.style.height = "auto";
  userInput.style.height = Math.min(userInput.scrollHeight, 140) + "px";
});

clearBtn.onclick = () => {
  conversationHistory.length = 0;
  messagesEl.innerHTML = `<div class="msg system-note">Conversation effacée. Posez une nouvelle question.</div>`;
};

// Drag & drop
dropZone.addEventListener("click", () => fileInput.click());
dropZone.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") fileInput.click(); });
dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("drag-over"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));
dropZone.addEventListener("drop", e => {
  e.preventDefault();
  dropZone.classList.remove("drag-over");
  const file = e.dataTransfer.files[0];
  if (file) uploadPdf(file);
});
fileInput.addEventListener("change", () => {
  if (fileInput.files[0]) uploadPdf(fileInput.files[0]);
  fileInput.value = "";
});

// ── Init ───────────────────────────────────────────────────────────────────────

refreshStatus();
refreshSources();
setInterval(refreshStatus, 15000);
</script>
</body>
</html>
